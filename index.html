<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALINE WEBSITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .title {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.5rem;
    }
    .word {
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      font-weight: 100;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      user-select: none;
      animation: weightBreathing 4s ease-in-out infinite;
    }
    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .link-item {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #888888;
      text-decoration: none;
      transition: color 0.3s ease, letter-spacing 0.3s ease;
    }
    .link-item:hover {
      color: #ffffff;
      letter-spacing: 0.22em;
    }

    @keyframes weightBreathing {
      0%, 100% {
        font-weight: 100;
      }
      50% {
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <div class="word">EVALINE</div>
      <div class="word">WEBSITE</div>
    </div>
    <div class="links">
      <a href="https://evaline.online" class="link-item" target="_blank" rel="noopener">evaline.online</a>
      <a href="https://evaline.network" class="link-item" target="_blank" rel="noopener">evaline.network</a>
      <a href="https://evabot.online" class="link-item" target="_blank" rel="noopener">evabot.online</a>
    </div>
  </div>
</body>
</html>
