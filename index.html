<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALINE WEBSITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto Mono', monospace;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .word {
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 100;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      user-select: none;
      animation: weightBreathing 4s ease-in-out infinite;
    }
    .nav-link {
      position: absolute;
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(0.85rem, 1.8vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #888888;
      text-decoration: none;
      transition: color 0.3s ease, letter-spacing 0.3s ease;
      white-space: nowrap;
      z-index: 10;
      padding: 0.8rem;
    }
    .nav-link:hover {
      color: #ffffff;
      letter-spacing: 0.22em;
    }

    /* 4 Sides of the screen */
    .link-top {
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
    }
    .link-right {
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
    }
    .link-bottom {
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
    }
    .link-left {
      top: 50%;
      left: 2rem;
      transform: translateY(-50%);
    }

    @media (max-width: 768px) {
      .nav-link {
        font-size: 0.75rem;
      }
      .link-top { top: 1.2rem; }
      .link-bottom { bottom: 1.2rem; }
      .link-left { left: 0.5rem; }
      .link-right { right: 0.5rem; }
    }

    @keyframes weightBreathing {
      0%, 100% {
        font-weight: 100;
      }
      50% {
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <!-- Top Side -->
  <a href="https://evaline.website" class="nav-link link-top" target="_blank" rel="noopener">evaline.website</a>

  <!-- Right Side -->
  <a href="https://evaline.online" class="nav-link link-right" target="_blank" rel="noopener">evaline.online</a>

  <!-- Bottom Side -->
  <a href="https://evaline.network" class="nav-link link-bottom" target="_blank" rel="noopener">evaline.network</a>

  <!-- Left Side -->
  <a href="https://evabot.online" class="nav-link link-left" target="_blank" rel="noopener">evabot.online</a>

  <!-- Center Title -->
  <div class="container">
    <div class="word">EVALINE</div>
    <div class="word">WEBSITE</div>
  </div>
</body>
</html>
