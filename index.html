<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVALINE WEBSITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto Mono', monospace;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: 'Roboto Mono', monospace;
      background-color: #0d0d0d;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .word {
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 100;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      user-select: none;
      animation: weightBreathing 4s ease-in-out infinite;
    }
    .nav-link {
      position: absolute;
      font-family: 'Roboto Mono', monospace;
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #888888;
      text-decoration: none;
      transition: color 0.3s ease;
      white-space: nowrap;
      z-index: 10;
    }
    .nav-link:hover {
      color: #ffffff;
    }

    /* 4 Corners of the screen */
    .link-top-left {
      top: 2rem;
      left: 2.5rem;
    }
    .link-top-right {
      top: 2rem;
      right: 2.5rem;
    }
    .link-bottom-left {
      bottom: 2rem;
      left: 2.5rem;
    }
    .link-bottom-right {
      bottom: 2rem;
      right: 2.5rem;
    }

    @media (max-width: 640px) {
      .nav-link {
        font-size: 0.75rem;
      }
      .link-top-left { top: 1.2rem; left: 1.2rem; }
      .link-top-right { top: 1.2rem; right: 1.2rem; }
      .link-bottom-left { bottom: 1.2rem; left: 1.2rem; }
      .link-bottom-right { bottom: 1.2rem; right: 1.2rem; }
    }

    @keyframes weightBreathing {
      0%, 100% {
        font-weight: 100;
      }
      50% {
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <!-- Top Left Corner -->
  <a href="https://evaline.website" class="nav-link link-top-left" target="_blank" rel="noopener">evaline.website</a>

  <!-- Top Right Corner -->
  <a href="https://evaline.network" class="nav-link link-top-right" target="_blank" rel="noopener">evaline.network</a>

  <!-- Bottom Left Corner -->
  <a href="https://evaline.online" class="nav-link link-bottom-left" target="_blank" rel="noopener">evaline.online</a>

  <!-- Bottom Right Corner -->
  <a href="https://evabot.online" class="nav-link link-bottom-right" target="_blank" rel="noopener">evabot.online</a>

  <!-- Center Title -->
  <div class="container">
    <div class="word">EVALINE</div>
    <div class="word">WEBSITE</div>
  </div>
</body>
</html>
